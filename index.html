    <!-- SDK de Firebase en la nube -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { 
        getFirestore, 
        collection, 
        addDoc, 
        deleteDoc, 
        doc, 
        query, 
        orderBy, 
        onSnapshot 
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      // Configuración de tu proyecto Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyAPWmxhRSHjSjGYRLdNbsoZNJiQf0UfWfw",
        authDomain: "catalogo-a62b9.firebaseapp.com",
        projectId: "catalogo-a62b9",
        storageBucket: "catalogo-a62b9.firebasestorage.app",
        messagingSenderId: "475533436537",
        appId: "1:475533436537:web:b1c4b258994a2cf20316a8"
      };

      // Inicializar Firebase y Firestore
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const perfumesRef = collection(db, "perfumes");

      // Asignar al objeto global window para que lo usen las demás funciones
      window.db = db;
      window.perfumesRef = perfumesRef;
      window.addDoc = addDoc;
      window.deleteDoc = deleteDoc;
      window.doc = doc;

      // Escuchar cambios en tiempo real desde Firestore
      const q = query(perfumesRef, orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
          const products = [];
          snapshot.forEach((docSnap) => {
              products.push({ id: docSnap.id, ...docSnap.data() });
          });
          window.products = products;
          if (typeof window.renderProducts === 'function') {
              window.renderProducts();
          }
      });

/// Rotación automática de mensajes aleatorios con animación de desvanecimiento cada 15 segundos
function initQuoteRotator() {
    const quoteElement = document.getElementById('perfumeQuote');
    if (!quoteElement) return;

    // Ejecutar de inmediato al cargar
    setRandomQuote(quoteElement);

    // Cambiar automáticamente cada 15 segundos (15000 milisegundos)
    setInterval(() => {
        // Paso 1: Desvanecer hacia abajo la opacidad (Fade Out)
        quoteElement.style.opacity = 0;
        
        setTimeout(() => {
            // Paso 2: Cambiar el texto de manera aleatoria mientras está oculto
            const randomIndex = Math.floor(Math.random() * perfumeQuotes.length);
            quoteElement.textContent = perfumeQuotes[randomIndex];
            
            // Paso 3: Aparecer suavemente con animación (Fade In)
            quoteElement.style.opacity = 1;
        }, 700); // Tiempo sincronizado con la transición CSS
    }, 15000);
}

function setRandomQuote(element) {
    const randomIndex = Math.floor(Math.random() * perfumeQuotes.length);
    element.textContent = perfumeQuotes[randomIndex];
}

// Iniciar el rotador al cargar la página
document.addEventListener('DOMContentLoaded', initQuoteRotator);
let currentBgIndex = 0;
let activeSlide = 1;

function initBackgroundSlider() {
    const slide1 = document.getElementById('bgSlide1');
    const slide2 = document.getElementById('bgSlide2');
    if (!slide1 || !slide2) return;

    // Inicializar primera imagen
    slide1.style.backgroundImage = `url('${bgPerfumeImages[0]}')`;

    // Cambiar de imagen cada 5 segundos
    setInterval(() => {
        currentBgIndex = (currentBgIndex + 1) % bgPerfumeImages.length;
        const nextImageUrl = bgPerfumeImages[currentBgIndex];

        if (activeSlide === 1) {
            slide2.style.backgroundImage = `url('${nextImageUrl}')`;
            slide2.classList.remove('opacity-0');
            slide2.classList.add('opacity-100');
            slide1.classList.remove('opacity-100');
            slide1.classList.add('opacity-0');
            activeSlide = 2;
        } else {
            slide1.style.backgroundImage = `url('${nextImageUrl}')`;
            slide1.classList.remove('opacity-0');
            slide1.classList.add('opacity-100');
            slide2.classList.remove('opacity-100');
            slide2.classList.add('opacity-0');
            activeSlide = 1;
        }
    }, 5000);
}

        window.products = [];

        function promptAdminAccess() {
            const pin = prompt("Ingrese el PIN de Administrador:");
            if (pin === "1106") {
                document.getElementById('adminBadge').classList.remove('hidden');
                openModal('adminPanelModal');
                renderAdminList();
            } else if (pin !== null) {
                alert("PIN incorrecto.");
            }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = btn.dataset.cat === cat 
                    ? 'category-btn px-5 py-2 rounded-full text-xs font-medium bg-gold-500 text-black'
                    : 'category-btn px-5 py-2 rounded-full text-xs font-medium bg-cardBg text-gray-400 border border-gold-900/30';
            });
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortBy').value;

            let filtered = window.products.filter(p => {
                const matchesCat = currentCategory === 'Todos' || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchVal) || p.desc.toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            filtered.sort((a, b) => {
                if (sortBy === 'price-asc') return a.price - b.price;
                if (sortBy === 'price-desc') return b.price - a.price;
                return b.createdAt - a.createdAt;
            });

            grid.innerHTML = '';
            if (filtered.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                return;

           filtered.forEach(p => {

                  : `<span class="text-[10px] bg-red-950/80 text-red-400 border border-red-500/30 px-2 py-0.5 rounded-full">Agotado</span>`;

              const waMessage = encodeURIComponent(`Hola, me interesa adquirir la fragancia "${p.name}" (Unidades disponibles: ${stockCount}) por $${Number(p.price).toLocaleString('es-CO')}. ¿Está disponible?`);
                const card = document.createElement('div');
                card.className = 'bg-cardBg border border-gold-900/30 rounded-2xl overflow-hidden p-4 flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        <div class="w-full h-60 bg-black/40 rounded-xl mb-3 flex items-center justify-center overflow-hidden p-2 border border-gold-900/10 relative">
                            <img src="${p.image}" alt="${p.name}" class="max-h-full max-w-full object-contain" onerror="this.src='https://placehold.co/400x400/13131a/c58e2b?text=Perfume'">
                            <div class="absolute top-2 right-2">${stockBadge}</div>
                        </div>
                        <span class="text-[10px] text-gold-400 uppercase tracking-widest">${p.category}</span>
                        <h3 class="text-lg font-serif text-white mt-1">${p.name}</h3>
                        <p class="text-gray-400 text-xs mt-1 line-clamp-2">${p.desc}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-gold-900/20 flex items-center justify-between">
                       <span class="text-white font-serif text-base">$${Number(p.price).toLocaleString('es-CO')}</span>
                        <a href="https://wa.me/573217088014?text=${waMessage}" target="_blank" class="bg-[#25d366]/20 text-[#25d366] px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center space-x-1">
                            <i class="fa-brands fa-whatsapp"></i><span>Pedir</span>
                        </a>

                `;
                grid.appendChild(card);
            });

            renderAdminList();
        }

     function renderAdminList() {
            const adminList = document.getElementById('adminProductList');
            if (!adminList) return;
            adminList.innerHTML = '';

            window.products.forEach(p => {
                const currentStock = p.stock !== undefined ? p.stock : 1;
                const row = document.createElement('div');
                row.className = 'bg-darkBg p-4 rounded-xl border border-gold-900/30 space-y-3';
                row.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <div class="w-12 h-12 bg-black/40 rounded-lg flex items-center justify-center overflow-hidden p-1 flex-shrink-0 border border-gold-900/20">
                            <img src="${p.image}" id="preview-img-${p.id}" class="max-h-full max-w-full object-contain">
                        </div>
                        <div class="w-full">
                            <label class="block text-[9px] text-gray-400">Nombre del Perfume</label>
                            <input type="text" id="edit-name-${p.id}" value="${p.name}" class="w-full bg-cardBg border border-gold-900/40 rounded-lg px-2.5 py-1 text-xs text-white">
                        </div>
                        <button onclick="deleteProduct('${p.id}')" class="text-red-400 hover:text-red-300 text-xs px-3 py-2 bg-red-950/40 rounded-lg flex-shrink-0 self-end" title="Eliminar artículo">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-[9px] text-gray-400">Categoría</label>
                            <select id="edit-category-${p.id}" class="w-full bg-cardBg border border-gold-900/40 rounded-lg px-2 py-1 text-xs text-gray-200">
                                <option value="Femenino" ${p.category === 'Femenino' ? 'selected' : ''}>Femenino</option>
                                <option value="Masculino" ${p.category === 'Masculino' ? 'selected' : ''}>Masculino</option>
                                <option value="Unisex" ${p.category === 'Unisex' ? 'selected' : ''}>Unisex</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[9px] text-gray-400">Precio ($)</label>
                            <input type="number" id="edit-price-${p.id}" step="0.01" value="${p.price}" class="w-full bg-cardBg border border-gold-900/40 rounded-lg px-2.5 py-1 text-xs text-gold-300">
                        </div>
                        <div>
                            <label class="block text-[9px] text-gray-400">Unidades</label>
                            <input type="number" id="edit-stock-${p.id}" min="0" value="${currentStock}" class="w-full bg-cardBg border border-gold-900/40 rounded-lg px-2.5 py-1 text-xs text-gold-300">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[9px] text-gray-400">Descripción y notas olfativas</label>
                        <textarea id="edit-desc-${p.id}" rows="2" class="w-full bg-cardBg border border-gold-900/40 rounded-lg px-2.5 py-1 text-xs text-gray-200 resize-none">${p.desc || ''}</textarea>
                    </div>

                    <div>
                        <label class="block text-[9px] text-gray-400">Reemplazar imagen (Opcional):</label>
                        <input type="file" id="edit-image-file-${p.id}" accept="image/*" class="w-full text-xs text-gray-400 border border-gold-900/40 rounded-lg p-1.5 bg-cardBg">
                    </div>

                    <button onclick="updateProduct('${p.id}')" id="update-btn-${p.id}" class="w-full bg-gold-600 hover:bg-gold-500 text-black font-semibold py-2 rounded-lg text-xs transition-colors shadow-md">
                        <i class="fa-solid fa-floppy-disk mr-1"></i> Guardar Todos los Cambios
                    </button>
                `;
                adminList.appendChild(row);
            });
        }
        // Función auxiliar para comprimir imágenes grandes de móviles antes de subirlas
        function compressImage(file, maxWidth = 600, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Guardando en la nube...";

            const name = document.getElementById('pName').value.trim();
            const category = document.getElementById('pCategory').value;
            const price = parseFloat(document.getElementById('pPrice').value);
            const stock = parseInt(document.getElementById('pStock').value) || 1;
            const desc = document.getElementById('pDesc').value.trim();
            const fileInput = document.getElementById('pImageFile');

            try {
                let imageUrl = 'https://placehold.co/400x400/13131a/c58e2b?text=Perfume';

                if (fileInput.files && fileInput.files[0]) {
                    // Comprimimos la foto del móvil para que no pese de más
                    imageUrl = await compressImage(fileInput.files[0]);
                }

                await window.addDoc(window.perfumesRef, {
                    name,
                    category,
                    price,
                    stock,
                    desc,
                    image: imageUrl,
                    createdAt: Date.now()
                });

                alert("¡Perfume publicado en vivo en la nube con éxito!");
                e.target.reset();
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Hubo un error al guardar. Es posible que la imagen aún sea muy pesada, intenta con otra foto.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Guardar Perfume en la Nube";
            }
        }

        async function deleteProduct(id) {
            if (confirm("¿Deseas eliminar este perfume de la nube?")) {
                await window.deleteDoc(window.doc(window.db, "perfumes", id));
            }
        }
       async function updateProduct(id) {
            const updateBtn = document.getElementById(`update-btn-${id}`);
            updateBtn.disabled = true;
            updateBtn.textContent = "Actualizando en la nube...";

            const newName = document.getElementById(`edit-name-${id}`).value.trim();
            const newCategory = document.getElementById(`edit-category-${id}`).value;
            const newPrice = parseFloat(document.getElementById(`edit-price-${id}`).value);
            const newStock = parseInt(document.getElementById(`edit-stock-${id}`).value);
            const newDesc = document.getElementById(`edit-desc-${id}`).value.trim();
            const fileInput = document.getElementById(`edit-image-file-${id}`);

            if (!newName || isNaN(newPrice) || isNaN(newStock) || !newDesc) {
                alert("Por favor, completa correctamente todos los campos obligatorios.");
                updateBtn.disabled = false;
                updateBtn.textContent = "Guardar Todos los Cambios";
                return;
            }

            try {
                const { updateDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
                const productRef = doc(window.db, "perfumes", id);
                
                // Buscar el producto actual para conservar su imagen si no se selecciona una nueva
                const currentProduct = window.products.find(p => p.id === id);
                let imageUrl = currentProduct ? currentProduct.image : '';

                // Si el usuario subió una foto nueva para reemplazar la anterior, la comprimimos
                if (fileInput.files && fileInput.files[0]) {
                    imageUrl = await compressImage(fileInput.files[0]);
                }

                await updateDoc(productRef, {
                    name: newName,
                    category: newCategory,
                    price: newPrice,
                    stock: newStock,
                    desc: newDesc,
                    image: imageUrl
                });

                alert("¡Información del producto actualizada por completo en la nube con éxito!");
            } catch (error) {
                console.error("Error al actualizar:", error);
                alert("Hubo un error al actualizar el artículo.");
            } finally {
                updateBtn.disabled = false;
                updateBtn.textContent = "Guardar Todos los Cambios";
            }
        }
    </script>
